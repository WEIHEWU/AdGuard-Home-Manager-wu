name: Publish Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.24.7
          name: "AdGuard Home Manager v2.24.7"
          body: |
            ### AdGuard Home Manager `v2.24.7`

            专为 **[AdGuard Home For Android](https://github.com/WEIHEWU/AdGuard-Home-For-Android-wu)** 定制的配套管理器客户端。

            #### 🆕 v2.24.7 更新内容
            - **应用放行名单（App Allowlist）管理**：
              - 设置 -> 模块专属设置中新增「应用放行名单」入口，支持一键勾选已安装应用、包名搜索与手动输入自定义包名；
              - 针对网银、外服游戏、交管等特殊应用，在前台运行时自动暂停过滤，离开后秒级自动恢复。
            - **首页数据概览样式切换（Overview Style）**：
              - 首页全新支持 **折线图 (Line)**、**柱状图 (Bar)**、**数字卡片 (Cards)** 3 种概览模式自由切换，满足图表趋势或紧凑数字不同偏好。
            - **弹窗应用遮罩与动效重构**：
              - 模块弹窗与应用放行面板全面升级 **8px 高斯模糊毛玻璃背景遮罩 (`BackdropFilter`)**，消除窗口层级撕裂；
              - 引入全局弹性阻尼回弹动效 (`BouncingScrollPhysics`) 与卡片按压触感反馈 (`HapticFeedback`)。
          files: |
            releases/AdGuardHomeManager.apk
