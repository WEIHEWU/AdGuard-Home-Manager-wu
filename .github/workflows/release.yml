name: Publish Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.24.10
          name: "AdGuard Home Manager v2.24.10"
          body: |
            ### AdGuard Home Manager `v2.24.10`

            专为 **[AdGuard Home For Android](https://github.com/WEIHEWU/AdGuard-Home-For-Android-wu)** 定制的配套管理器客户端。

            #### 🆕 v2.24.10 更新内容
            - **首页极简二合一顶卡重构 (`ProtectionSwitch` + `ModuleQuickActions`)**：
              - 将首页顶部总开关卡片与模块快捷操作合并为单张 2 行卡片，定时暂停收纳至主开关左侧 `⏱️` 菜单，下方仅保留 **「误杀排错 · 应用白名单 · 网络刷新」** 三个高频按钮；
              - 遵循**「常态隐形、异常告警」**设计原则：移除常态下的标题栏、内存标签与 3 个状态徽章；仅当检测到核心未运行或 `DNS/SNI` 转发异常时，才在快捷按钮上方浮现单行橙色告警与 **「一键修复」** 按钮。
            - **弹窗与设置项全面极简化**：
              - 移除「误杀排错」与「应用白名单」弹窗顶部冗长的多行说明横幅，白名单列表副标题仅展示干净包名；
              - 设置页模块诊断与功能项副标题全面收敛为简短单行。
          files: |
            releases/AdGuardHomeManager.apk
