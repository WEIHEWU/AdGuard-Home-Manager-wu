name: Publish Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.24.8
          name: "AdGuard Home Manager v2.24.8"
          body: |
            ### AdGuard Home Manager `v2.24.8`

            专为 **[AdGuard Home For Android](https://github.com/WEIHEWU/AdGuard-Home-For-Android-wu)** 定制的配套管理器客户端。

            #### 🆕 v2.24.8 更新内容
            - **VPN 智能无感协同状态自检展示**：
              - 配合模块底层零耗电本地自动识别引擎（`VPN_DNS_TAKEOVER=auto`），彻底移除繁琐的手动模式开关；
              - 在「设置 -> 模块运行状态与自检」中自动实时显示当前识别到的 VPN 协同状态（`VPN: 回国去广告` / `VPN: 翻墙防污染`）。
            - **包含 v2.24.7 全部特性**：应用放行名单管理、首页 3 种数据概览样式切换、8px 毛玻璃遮罩与弹性动效。
          files: |
            releases/AdGuardHomeManager.apk
